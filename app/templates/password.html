{% extends 'base.html' %}{% from 'macros.html' import csrf with context %}{% block content %}<div class="page-heading"><div><h1>Change password.</h1><p>Use 12–128 characters. Changing your password invalidates other sessions.</p></div></div><section class="panel padded narrow"><form method="post" class="stack-form">{{ csrf() }}<label>Current password<input class="form-control" type="password" name="current_password" autocomplete="current-password" maxlength="128" required></label><label>New password<input class="form-control" type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="btn btn-primary">Update password</button></form></section>{% endblock %}
