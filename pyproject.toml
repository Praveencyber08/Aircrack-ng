[project]
name = "spectra-wifi-security"
version = "1.0.0"
description = "Authorized Wi-Fi security assessment and reporting"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<3.2",
    "Flask-SQLAlchemy>=3.1,<3.2",
    "Flask-Login>=0.6.3,<0.7",
    "Flask-WTF>=1.2,<1.3",
    "Flask-Limiter>=3.12,<5",
    "python-dotenv>=1.1,<2",
    "reportlab>=4.4,<5",
    "scapy>=2.6,<2.8",
    "waitress>=3.0,<4",
]

[tool.vercel]
entrypoint = "wsgi:app"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
